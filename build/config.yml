# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 update build-assets` to update the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "go-music-tools"
  productName: "Music Tools"
  productIdentifier: "com.gomusictools.app"
  description: "音乐下载与整理工作台"
  copyright: "(c) 2026, go-music-tools"
  comments: "Go + Wails + Vue + TypeScript"
  version: "1.0.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - build/bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary

# File Associations
fileAssociations:
#  - ext: wails
#    name: Wails
#    description: Wails Application File
#    iconName: wailsFileIcon
#    role: Editor
